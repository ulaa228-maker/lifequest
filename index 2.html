<style>
  :root{--acc:#8b5cf6;--acc2:#6366f1;--onacc:#fff;--track:rgba(255,255,255,.07);color-scheme:dark}
  html{-webkit-text-size-adjust:100%}
  html,body{background:#09090b;color:#f4f4f5;font-family:Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.06);border-radius:20px}
  .mod{transition:transform .25s ease,border-color .25s ease,background .25s}
  .mod:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
  .mod:active{transform:scale(.98)}
  .acc-text{color:var(--acc)}
  .acc-bg{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc)}

  .glow{position:absolute;width:320px;height:320px;right:-120px;top:-160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 35%,transparent),transparent 70%);pointer-events:none}
  .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--h) 15%,transparent);color:var(--h);flex-shrink:0}
  .ico svg{width:21px;height:21px}
  .inp{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;font-size:14px;outline:none;color:#f4f4f5;min-width:0;transition:border-color .2s}
  .inp:focus{border-color:var(--acc)}
  .inp::placeholder{color:#71717a}
  input[type=date].inp{color-scheme:dark}
  .btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;transition:filter .2s,transform .1s;white-space:nowrap}
  .btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.35;pointer-events:none}
  .btn-soft{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;transition:background .2s;white-space:nowrap}
  .btn-soft:hover{background:rgba(255,255,255,.1)}
  .btn-ghost{color:#a1a1aa;transition:color .2s,background .2s}.btn-ghost:hover{color:#fff;background:rgba(255,255,255,.06)}
  .chip{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;transition:all .2s}
  .chip:hover{border-color:var(--acc)}
  .chip.on{background:color-mix(in srgb,var(--acc) 18%,transparent);border-color:var(--acc);color:#fff}
  .label{font-size:12px;color:#a1a1aa;font-weight:500}
  .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .ring-p{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
  .fade{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .bob{animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .pet{position:relative;display:inline-block;line-height:1}

  .pet .head{top:-38%;font-size:.55em}
  .pet .face{top:24%;font-size:.42em}
  .pet .neck{bottom:-10%;font-size:.42em}

  .cb{width:22px;height:22px;border-radius:7px;border:1.5px solid rgba(255,255,255,.18);display:grid;place-items:center;flex-shrink:0;transition:all .2s}
  .cb.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:var(--onacc)}

  /* sudoku */

  .sc{display:grid;place-items:center;font-size:clamp(16px,5vw,24px);font-weight:600;border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer;transition:background .15s}
  .sc.br{border-right:2px solid rgba(255,255,255,.35)}.sc.bb{border-bottom:2px solid rgba(255,255,255,.35)}
  .sc.given{color:#e4e4e7}.sc.user{color:var(--acc)}.sc.bad{color:#f87171;background:rgba(248,113,113,.12)}
  .sc.rel{background:rgba(255,255,255,.035)}.sc.same{background:color-mix(in srgb,var(--acc) 16%,transparent)}
  .sc.sel{background:color-mix(in srgb,var(--acc) 32%,transparent)}
  .npad button{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.05);font-size:20px;font-weight:600;position:relative;transition:background .15s}
  .npad button:hover{background:rgba(255,255,255,.1)}
  .npad button small{position:absolute;bottom:3px;right:6px;font-size:9px;color:#71717a}
  .toast{animation:tin .3s ease both}

  html[data-mode=light] .navlink{color:#52525b}html[data-mode=light] .navlink.on{color:#18181b;background:rgba(0,0,0,.06)}
  html[data-mode=light] .mnav a{color:#71717a}html[data-mode=light] .mnav a.on{color:var(--acc)}
  html[data-mode=light] .cb{border-color:rgba(0,0,0,.25)}

  html[data-mode=light] .sc.br{border-right-color:rgba(0,0,0,.45)}html[data-mode=light] .sc.bb{border-bottom-color:rgba(0,0,0,.45)}
  html[data-mode=light] .sc.given{color:#27272a}html[data-mode=light] .sc.rel{background:rgba(0,0,0,.04)}
  html[data-mode=light] .npad button{background:rgba(0,0,0,.05)}html[data-mode=light] .npad button:hover{background:rgba(0,0,0,.1)}
  html[data-mode=light] ::-webkit-scrollbar-thumb{background:#d4d4d8}

  html[data-mode=light] .bg-amber-400\/10{background:rgba(245,158,11,.15)}

  html[data-mode=light] .bg-white\/\[\.03\],html[data-mode=light] .hover\:bg-white\/\[\.02\]:hover{background:rgba(0,0,0,.035)}
  html[data-mode=light] .bg-white\/\[\.04\],html[data-mode=light] .bg-white\/\[\.05\],html[data-mode=light] .bg-white\/\[\.06\]{background:rgba(0,0,0,.05)}

  html,body{transition:background-color .25s,color .25s}

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, isFinite(x) ? x : 0));
const pct = x => Math.round(clamp(x) * 100);
const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };

/* Bishkek time: UTC+6, no DST */
const bNow = () => new Date(Date.now() + 6 * 3600e3);
const keyOf = d => d.toISOString().slice(0, 10);
const today = () => keyOf(bNow());
const fromKey = k => new Date(k + 'T00:00:00Z');
const addDays = (k, n) => keyOf(new Date(fromKey(k).getTime() + n * 864e5));
const dowOf = k => fromKey(k).getUTCDay();
const weekStart = (k = today()) => addDays(k, -((dowOf(k) + 6) % 7));
const weekDays = (k = today()) => { const s = weekStart(k); return [...Array(7)].map((_, i) => addDays(s, i)); };
const monthKey = (k = today()) => k.slice(0, 7);
const isWeekend = k => { const d = dowOf(k); return d === 0 || d === 6; };
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_N = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const DOW_S = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const DOW_L = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const fmtDay = k => { const d = fromKey(k); return `${d.getUTCDate()} ${MONTHS_G[d.getUTCMonth()]}`; };
const weekSum = obj => weekDays().reduce((a, k) => a + (+obj?.[k] || 0), 0);
const weekCount = obj => weekDays().filter(k => obj?.[k]).length;
const monthSum = obj => Object.entries(obj || {}).filter(([k]) => k.startsWith(monthKey())).reduce((a, [, v]) => a + (+v || 0), 0);
const monthCount = obj => Object.entries(obj || {}).filter(([k, v]) => k.startsWith(monthKey()) && v).length;
const daysLeftInMonth = () => { const n = bNow(); const last = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth() + 1, 0)).getUTCDate(); return last - n.getUTCDate() + 1; };
const plural = (n, a, b, c) => { const m = Math.abs(n) % 100, l = m % 10; return m > 10 && m < 20 ? c : l > 1 && l < 5 ? b : l === 1 ? a : c; };

/* ============ data ============ */
const SUBJECTS = ['Биология','Физика','Русский язык','Литература','География','Допризывная подготовка','Кыргызский язык','Геометрия','ЧИО','Химия','Адабият','Английский','Алгебра','История'];
const SKATE = [
  ['stance','Стойка и баланс на стоящей доске'],['push','Толчок и езда по прямой'],['brake','Торможение ногой'],
  ['turn','Повороты наклоном (carving)'],['circle','Езда по кругу в обе стороны'],['slope','Спуск с небольшого уклона'],
  ['kick','Kick turn (разворот на задних колёсах)'],['manual','Мэнуал 2 секунды'],['ollie','Олли на месте'],['ollie2','Олли в движении']
];
const ENG = [
  ['goal','Определить цель: зачем мне английский'],['list','Найти 2–3 курса или школы'],['price','Узнать цены и расписание'],
  ['trial','Сходить на пробный урок'],['signup','Записаться на курсы'],['test','Пройти тест на уровень'],
  ['week','Отходить первую неделю занятий'],['talk','Набрать 10 часов разговорной практики']
];
const LEVELS = ['A1','A2','B1','B2','C1','C2'];
const ORT_SECTIONS = ['Математика','Аналогии','Чтение','Грамматика'];
const SUD = { easy:{n:'Лёгкий',rm:36,r:10}, medium:{n:'Средний',rm:46,r:20}, hard:{n:'Сложный',rm:52,r:35}, expert:{n:'Эксперт',rm:57,r:60} };

const THEMES = [
  {id:'violet',n:'Аметист',p:0,a:'#8b5cf6',b:'#6366f1'},{id:'emerald',n:'Изумруд',p:100,a:'#10b981',b:'#0d9488'},
  {id:'amber',n:'Янтарь',p:100,a:'#f59e0b',b:'#ea580c'},{id:'rose',n:'Роза',p:120,a:'#f43f5e',b:'#db2777'},
  {id:'cyan',n:'Лёд',p:120,a:'#22d3ee',b:'#3b82f6'},{id:'lime',n:'Лайм',p:150,a:'#a3e635',b:'#16a34a',on:'#111'},
  {id:'gold',n:'Золото',p:300,a:'#facc15',b:'#d97706',on:'#111'},{id:'mono',n:'Графит',p:80,a:'#e4e4e7',b:'#a1a1aa',on:'#111'}
];
const PETS = [
  {id:'cat',e:'🐱',n:'Котик',p:150},{id:'dog',e:'🐶',n:'Пёсик',p:150},{id:'owl',e:'🦉',n:'Сова',p:200},
  {id:'fox',e:'🦊',n:'Лис',p:220},{id:'panda',e:'🐼',n:'Панда',p:300},{id:'dragon',e:'🐲',n:'Дракон',p:500}
];

  {id:'scarf',e:'🧣',n:'Шарф',s:'neck',p:60},{id:'medal',e:'🏅',n:'Медаль',s:'neck',p:120}
];
const SLOT_N = {head:'Голова',face:'Лицо',neck:'Шея'};

const MODS = [
  {id:'reading',t:'Чтение книг',i:'book-open',h:'#38bdf8'},
  {id:'skate',t:'Скейт с нуля',i:'skate',h:'#fb923c'},
  {id:'gym',t:'Поход в зал',i:'dumbbell',h:'#f87171'},
  {id:'ort',t:'Сделать ОРТ',i:'target',h:'#818cf8'},
  {id:'english',t:'Английский',i:'languages',h:'#34d399'},
  {id:'sudoku',t:'Судоку',i:'grid-3x3',h:'#fbbf24'}
];
const MOD = Object.fromEntries(MODS.map(m => [m.id, m]));

function defaultState(){
  const subjects = {}; SUBJECTS.forEach(s => subjects[s] = {grades:[], hw:[]});
  return {
    v:1, updatedAt:0, coins:50,
    profile:{name:'Игрок', avatar:'🧑'},
    stats:{earned:0},
    books:[], readGoal:200, readLog:{},
    skate:{skills:{}, sessions:{}},
    gym:{workouts:{}, startWeight:'', curWeight:'', startBench:'', curBench:''},
    ort:{days:{}, exam:''},
    eng:{steps:{}, level:'A1', practice:{}},
    sudoku:{solved:{easy:0,medium:0,hard:0,expert:0}, log:{}, hist:[], cur:null},
    school:subjects,

/* Sudoku */
let sSel = -1, sGen = null;
function sOk(g, i, n){ const r = i / 9 | 0, c = i % 9, br = r - r % 3, bc = c - c % 3;
  for (let k = 0; k < 9; k++) { if (g[r * 9 + k] === n || g[k * 9 + c] === n) return false; if (g[(br + (k / 3 | 0)) * 9 + bc + k % 3] === n) return false; } return true; }
const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function sFill(g){ const i = g.indexOf(0); if (i < 0) return true;
  for (const n of shuf([1,2,3,4,5,6,7,8,9])) if (sOk(g, i, n)) { g[i] = n; if (sFill(g)) return true; g[i] = 0; } return false; }
function sCount(g, lim){
  let best = -1, bc = null;
  for (let i = 0; i < 81; i++) if (!g[i]) { const c = []; for (let n = 1; n <= 9; n++) if (sOk(g, i, n)) c.push(n);
    if (!c.length) return 0; if (!bc || c.length < bc.length) { best = i; bc = c; if (c.length === 1) break; } }
  if (best < 0) return 1;
  let t = 0; for (const n of bc) { g[best] = n; t += sCount(g, lim - t); if (t >= lim) break; } g[best] = 0; return t;
}
function sGenerate(level){
  const sol = Array(81).fill(0); sFill(sol);
  const puz = sol.slice(); let removed = 0; const target = SUD[level].rm, t0 = Date.now();
  for (const i of shuf([...Array(81).keys()])) {
    if (removed >= target || Date.now() - t0 > 2500) break;
    const v = puz[i]; puz[i] = 0;
    if (sCount(puz.slice(), 2) !== 1) puz[i] = v; else removed++;
  }
  return {l:level, puz, sol, cur:puz.slice(), err:0, hints:0};
}
V.sudoku = () => {
  const s = state.sudoku, c = s.cur;
  const levels = `<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">${Object.entries(SUD).map(([k, v]) => `<button data-a="sNew" data-l="${k}" class="card mod p-4 text-left ${c && c.l === k ? 'acc-border' : ''}">
      <div class="font-bold">${v.n}</div><div class="text-xs text-zinc-500 mt-1">решено: ${s.solved[k]}</div><div class="text-xs text-amber-300/80 mt-2">+${v.r} 🪙</div></button>`).join('')}</div>`;
  if (sGen) return `<div class="fade">${pageHead('sudoku', 'Головоломки от лёгких до экспертных')}<div class="card p-10 text-center text-zinc-400"><div class="animate-spin w-8 h-8 border-2 border-white/10 rounded-full mx-auto mb-3" style="border-top-color:var(--acc)"></div>Генерирую головоломку «${SUD[sGen].n}»…</div></div>`;
  if (!c) return `<div class="fade">${pageHead('sudoku', 'Головоломки от лёгких до экспертных')}${sectionTitle('Выбери уровень')}${levels}
    <p class="text-xs text-zinc-500 mt-4">Прогресс раздела — сколько уровней ты покорил хотя бы раз (каждый даёт 25%).</p></div>`;
  const sv = sSel >= 0 ? c.cur[sSel] : 0, sr = sSel / 9 | 0, scl = sSel % 9;
  const cells = c.cur.map((v, i) => {
    const r = i / 9 | 0, cl = i % 9, given = c.puz[i] !== 0, bad = v && v !== c.sol[i];
    const rel = sSel >= 0 && (r === sr || cl === scl || ((r / 3 | 0) === (sr / 3 | 0) && (cl / 3 | 0) === (scl / 3 | 0)));
    const cls = ['sc', cl === 2 || cl === 5 ? 'br' : '', r === 2 || r === 5 ? 'bb' : '', given ? 'given' : v ? 'user' : '', bad ? 'bad' : '',
      i === sSel ? 'sel' : sv && v === sv ? 'same' : rel ? 'rel' : ''].join(' ');
    return `<div class="${cls}" data-a="sCell" data-i="${i}">${v || ''}</div>`;
  }).join('');
  const cnt = n => 9 - c.cur.filter((v, i) => v === n && v === c.sol[i]).length;
  return `<div class="fade">${pageHead('sudoku', 'Головоломки от лёгких до экспертных')}
  <div class="flex flex-col lg:flex-row gap-5 items-center lg:items-start">
    <div class="w-full max-w-[440px]">
      <div class="flex justify-between text-sm mb-3"><span class="font-bold">${SUD[c.l].n}</span><span class="text-zinc-400">Ошибки: <b class="${c.err ? 'text-red-400' : ''}">${c.err}</b> · Подсказки: ${c.hints}</span></div>
      <div class="sgrid mx-auto">${cells}</div>
    </div>
    <div class="w-full max-w-[440px] lg:max-w-[300px]">
      <div class="npad grid grid-cols-5 lg:grid-cols-3 gap-2">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-a="sNum" data-n="${n}" ${cnt(n) <= 0 ? 'class="opacity-30"' : ''}>${n}<small>${Math.max(0, cnt(n))}</small></button>`).join('')}
        <button data-a="sErase" aria-label="Стереть" class="grid place-items-center"><i data-lucide="eraser" class="w-5 h-5"></i></button></div>
      <div class="grid grid-cols-2 gap-2 mt-3">
        <button data-a="sHint" class="btn-soft flex items-center justify-center gap-2"><i data-lucide="lightbulb" class="w-4 h-4"></i>Подсказка −5🪙</button>
        <button data-a="sQuit" class="btn-soft">Сменить уровень</button>
      </div>
      <p class="text-[11px] text-zinc-600 mt-3 hidden lg:block">Можно вводить цифры с клавиатуры, стрелки — перемещение.</p>

function setMode(p){ try { p === 'auto' ? localStorage.removeItem(MKEY) : localStorage.setItem(MKEY, p); } catch {} applyMode(); }

  modal(`<div class="flex items-center justify-between"><div class="text-lg font-bold">Профиль</div><button data-a="close" class="btn-ghost p-2 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button></div>
    <div class="flex items-center gap-3 mt-4 p-3 rounded-2xl bg-white/[.03]"><div class="text-4xl">${esc(state.profile.avatar)}</div><div><div class="font-bold">${esc(state.profile.name)}</div><div class="text-xs text-zinc-500">Уровень ${L} · заработано ${state.stats.earned} 🪙</div></div></div>
    <div class="grid grid-cols-4 gap-2 mt-3">${[['Квестов', Object.values(state.quests.done).reduce((n, d) => n + Object.keys(d || {}).length, 0)], ['Книг', state.books.filter(b => b.done).length], ['Судоку', Object.values(state.sudoku.solved).reduce((n, v) => n + v, 0)], ['Трен.', Object.values(state.gym.workouts).filter(Boolean).length]].map(([t, v]) => `<div class="rounded-xl bg-white/[.03] border border-white/5 py-2 text-center"><div class="font-extrabold tabular-nums">${v}</div><div class="text-[10px] text-zinc-500">${t}</div></div>`).join('')}</div>
    <div class="mt-4"><span class="label">Оформление</span><div class="grid grid-cols-3 gap-2 mt-1">${[['light', 'Светлая', 'sun'], ['dark', 'Тёмная', 'moon'], ['auto', 'Авто', 'monitor']].map(([m, t, i]) => `<button type="button" data-a="modeSet" data-m="${m}" class="chip !rounded-xl flex items-center justify-center gap-1.5 ${modePref() === m ? 'on' : ''}"><i data-lucide="${i}" class="w-4 h-4"></i>${t}</button>`).join('')}</div></div>
    <form data-f="profile" class="mt-4 space-y-3">
      <label class="block"><span class="label">Имя игрока</span><input name="n" maxlength="24" value="${esc(state.profile.name)}" class="inp w-full mt-1"></label>
      <div><span class="label">Аватар</span><div class="grid grid-cols-5 gap-2 mt-1">${AVATARS.map(a => `<label class="cursor-pointer"><input type="radio" name="a" value="${a}" class="peer hidden" ${state.profile.avatar === a ? 'checked' : ''}><div class="text-2xl py-2 rounded-xl text-center bg-white/[.03] border border-white/5 peer-checked:border-white/50 peer-checked:bg-white/10">${a}</div></label>`).join('')}</div></div>
      <button class="btn w-full">Сохранить</button>
    </form>
    ${accountHTML()}
    <button data-a="reset" class="w-full mt-3 text-xs text-red-400/80 py-2 hover:text-red-400">Сбросить весь прогресс</button>`);
}

/* ============ actions ============ */
const subjOf = el => SUBJECTS[+el.dataset.s];
const A = {
  close: closeModal,
  confirmYes(){ const f = onConfirm; onConfirm = null; closeModal(); f && f(); },
  profile: profileModal,
  mode(){ setMode(modeNow() === 'light' ? 'dark' : 'light'); },
  modeSet(el){ setMode(el.dataset.m); profileModal(); },
  async signIn(){
    if (!FB_ON) return setupModal();
    if (!fbAuth) return toast('Google ещё загружается — попробуй через секунду');
    const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
    try { await fbAuth.signInWithPopup(prov); closeModal(); }
    catch (e) {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) fbAuth.signInWithRedirect(prov);
      else if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(e.code)) toast('Не удалось войти: ' + esc(e.code || 'ошибка'));
    }
  },
  signOut(){ confirmBox('Ты выйдешь из аккаунта. Прогресс останется в облаке — войди снова, чтобы продолжить.', async () => { await fbAuth?.signOut(); toast('Ты вышел из аккаунта'); }); },
  reset(){ confirmBox('Все книги, оценки, коины и покупки будут удалены без возможности восстановления.', () => { state = defaultState(); persist(); applyTheme(); render(); toast('Прогресс сброшен'); }); },
  qDone(el){ const q = dailyQuests().find(x => x.id === el.dataset.id); if (!q || qDone(q)) return;
    (state.quests.done[today()] ||= {})[q.id] = true; earn(q.r, 'квест выполнен'); render(); },
  wqClaim(el){ const w = WQ.find(x => x.id === el.dataset.id), wk = weekStart(); const c = (state.quests.weekly[wk] ||= {});
    if (!w || c[w.id] || w.v() < w.g) return; c[w.id] = true; earn(w.r, 'недельный квест'); render(); },
  achClaim(el){ const a = ACH.find(x => x.id === el.dataset.id); if (!a) return; const k = achKey(a);
    if (state.ach[k] || a.v() < achGoal(a)) return; state.ach[k] = true; earn(a.r, `достижение «${a.t}»`); render(); },
  readAdd(el){ const n = +el.dataset.n; addPages(n); persist(); render(); toast(`📖 +${n} стр. засчитано`); },
  delBook(el){ const b = state.books.find(x => x.id === el.dataset.id); if (!b) return;
    confirmBox(`Удалить книгу «${esc(b.title)}»?`, () => { state.books = state.books.filter(x => x !== b); persist(); render(); }); },
  skill(el){ const s = state.skate.skills, id = el.dataset.id; if (s[id]) delete s[id]; else { s[id] = today(); toast('🛹 Навык освоен!'); } persist(); render(); },
  gymDay(el){ const w = state.gym.workouts, k = el.dataset.k; if (w[k]) delete w[k]; else w[k] = true; persist(); render(); },
  gymReset(){ const g = state.gym; confirmBox('Текущий вес тела станет стартовым для нового месяца.', () => { if (g.curWeight !== '') g.startWeight = g.curWeight; persist(); render(); }); },
  ortSec(el){ const s = el.dataset.s; ortSel.has(s) ? ortSel.delete(s) : ortSel.add(s); el.classList.toggle('on'); },
  ortUndo(){ delete state.ort.days[today()]; persist(); render(); },
  engLevel(el){ state.eng.level = el.dataset.l; persist(); render(); },
  engStep(el){ const s = state.eng.steps, id = el.dataset.id; if (s[id]) delete s[id]; else s[id] = today(); persist(); render(); },
  subj(el){ const n = subjOf(el); openSubj = openSubj === n ? null : n; render(); },
  addGrade(el){ state.school[subjOf(el)].grades.push({v:+el.dataset.v, d:today()}); persist(); render(); },
  delGrade(el){ state.school[subjOf(el)].grades.splice(+el.dataset.i, 1); persist(); render(); },
  hwToggle(el){ const h = state.school[subjOf(el)].hw.find(x => x.id === el.dataset.id); if (!h) return; h.done = !h.done; h.doneAt = h.done ? today() : null; persist(); render(); },
  hwDel(el){ const s = state.school[subjOf(el)]; s.hw = s.hw.filter(x => x.id !== el.dataset.id); persist(); render(); },
  shopTab(el){ shopTab = el.dataset.id; render(); },
  themeBuy(el){ const t = THEMES.find(x => x.id === el.dataset.id); if (!t || !spend(t.p)) return; state.shop.themes.push(t.id); state.shop.theme = t.id; persist(); applyTheme(); render(); toast(`🎨 Тема «${t.n}» куплена`); },
  themeUse(el){ state.shop.theme = el.dataset.id; persist(); applyTheme(); render(); },
  petBuy(el){ const p = PETS.find(x => x.id === el.dataset.id); if (!p || !spend(p.p)) return; state.shop.pets.push(p.id); state.shop.pet = p.id; persist(); render(); toast(`${p.e} ${p.n} теперь с тобой!`); },
  petUse(el){ state.shop.pet = el.dataset.id; persist(); render(); },
  accBuy(el){ const a = ACCS.find(x => x.id === el.dataset.id); if (!a || !spend(a.p)) return; state.shop.accs.push(a.id); if (state.shop.pet) state.shop.eq[a.s] = a.id; persist(); render(); toast(`${a.e} ${a.n} куплен(а)`); },
  accEq(el){ const a = ACCS.find(x => x.id === el.dataset.id); const eq = state.shop.eq; eq[a.s] = eq[a.s] === a.id ? null : a.id; persist(); render(); },
  sNew(el){ const l = el.dataset.l; sGen = l; sSel = -1; render();
    setTimeout(() => { state.sudoku.cur = sGenerate(l); sGen = null; persist(); render(); }, 60); },
  sQuit(){ state.sudoku.cur = null; sSel = -1; persist(); render(); },
  sCell(el){ sSel = +el.dataset.i; render(); },
  sNum(el){ sInput(+el.dataset.n); },
  sErase(){ const c = state.sudoku.cur; if (!c || sSel < 0 || c.puz[sSel]) return; c.cur[sSel] = 0; persist(); render(); },
  sHint(){ const c = state.sudoku.cur; if (!c) return;
    let i = sSel >= 0 && c.cur[sSel] !== c.sol[sSel] ? sSel : c.cur.findIndex((v, j) => v !== c.sol[j]);
    if (i < 0 || !spend(5)) return; c.cur[i] = c.sol[i]; c.hints++; sSel = i; persist(); sCheck(); render(); }
};
function addPages(n){
  if (n <= 0) return;
  state.readLog[today()] = (state.readLog[today()] || 0) + n;
  const b = activeBook();
  if (b) { b.read = Math.min(b.total, b.read + n); bookDone(b); }
}
function bookDone(b){ if (b.read >= b.total && !b.done) { b.done = true; earn(30, `книга «${b.title}» дочитана`); } }
function sInput(n){
  const c = state.sudoku.cur; if (!c || sSel < 0 || c.puz[sSel]) return;
  if (c.cur[sSel] === n) return;
  c.cur[sSel] = n;
  if (n !== c.sol[sSel]) c.err++;
  persist(); sCheck(); render();
}
function sCheck(){
  const c = state.sudoku.cur; if (!c || c.cur.some((v, i) => v !== c.sol[i])) return;
  const s = state.sudoku, r = SUD[c.l].r;
  s.solved[c.l]++; s.log[today()] = (s.log[today()] || 0) + 1;
  s.hist.push({d:today(), l:c.l}); if (s.hist.length > 300) s.hist = s.hist.slice(-300);
  const lvl = c.l; s.cur = null; sSel = -1;
  earn(r, `судоку «${SUD[lvl].n}» решено`);
  setTimeout(() => modal(`<div class="text-center"><div class="text-5xl">🧩</div><div class="text-xl font-bold mt-3">Головоломка решена!</div><p class="text-sm text-zinc-400 mt-1">Уровень «${SUD[lvl].n}» · +${r} 🪙</p><div class="grid grid-cols-2 gap-2 mt-6"><button data-a="close" class="btn-soft">Готово</button><button data-a="sNew" data-l="${lvl}" class="btn">Ещё одну</button></div></div>`), 150);
}
const F = {
  readGoal(f){ state.readGoal = Math.max(1, Math.round(num(f.g.value))) || 200; persist(); render(); },
  addBook(f){ const total = Math.max(1, Math.round(num(f.total.value))), read = Math.min(total, Math.max(0, Math.round(num(f.read.value))));
    const b = {id:uid(), title:f.title.value.trim() || 'Без названия', total, read, done:read >= total};
    state.books.push(b); persist(); render(); toast(`📚 «${esc(b.title)}» — ${pct(read / total)}%`); },
  bookRead(f){ const b = state.books.find(x => x.id === f.dataset.id); if (!b) return;
    const v = Math.min(b.total, Math.max(0, Math.round(num(f.read.value)))), d = v - b.read;
    if (d > 0) state.readLog[today()] = (state.readLog[today()] || 0) + d;
    b.read = v; bookDone(b); persist(); render(); },
  skateLog(f){ const m = Math.round(num(f.m.value)); if (m <= 0) return; state.skate.sessions[today()] = (state.skate.sessions[today()] || 0) + m; persist(); render(); toast(`🛹 +${m} мин катания`); },
  gymMass(f){ state.gym.startWeight = f.s.value; state.gym.curWeight = f.c.value; persist(); render(); },
  gymBench(f){ state.gym.curBench = f.c.value; persist(); render(); },
  ortLog(f){ const m = Math.max(5, Math.round(num(f.m.value))); state.ort.days[today()] = {m, s:[...ortSel]}; persist(); render(); toast('🎯 День подготовки засчитан'); },
  ortExam(f){ state.ort.exam = f.d.value; persist(); render(); },
  engLog(f){ const m = Math.round(num(f.m.value)); if (m <= 0) return; state.eng.practice[today()] = (state.eng.practice[today()] || 0) + m; persist(); render(); toast(`🗣️ +${m} мин практики`); },
  addHw(f){ const s = state.school[subjOf(f)]; s.hw.push({id:uid(), t:f.t.value.trim(), due:f.d.value || today(), done:false}); persist(); render(); },
  petName(f){ state.shop.petName = f.n.value.trim(); persist(); render(); toast('Имя сохранено'); },
  profile(f){ state.profile.name = f.n.value.trim() || 'Игрок'; const a = f.querySelector('input[name=a]:checked'); if (a) state.profile.avatar = a.value; persist(); closeModal(); render(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  if (el.tagName !== 'A') e.preventDefault();
  A[el.dataset.a]?.(el, e);
});
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target; F[f.dataset.f]?.(f); });
document.addEventListener('input', e => {
  const f = e.target.form; if (!f || f.dataset.f !== 'addBook') return;
  const t = num(f.total.value), r = num(f.read.value), out = $('#calcOut');
  if (t > 0) { const p = clamp(r / t); out.innerHTML = `<div class="flex items-center gap-3"><span class="text-2xl font-extrabold acc-text tabular-nums">${pct(p)}%</span><span>прочитано · осталось ${Math.max(0, t - r)} стр.</span></div>${bar(p, 'mt-2')}`; }
});
document.addEventListener('keydown', e => {
  if (route() !== 'sudoku' || !state.sudoku.cur || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  if (/^[1-9]$/.test(e.key)) { sInput(+e.key); e.preventDefault(); }
  else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') A.sErase();
  else if (e.key.startsWith('Arrow')) { if (sSel < 0) sSel = 0; else { const d = {ArrowUp:-9, ArrowDown:9, ArrowLeft:-1, ArrowRight:1}[e.key]; sSel = (sSel + d + 81) % 81; } render(); e.preventDefault(); }
});
document.addEventListener('click', e => { const a = e.target.closest('a[data-tab]'); if (a) shopTab = a.dataset.tab; }, true);

/* ============ clock ============ */
let lastDay = today();
function tick(){
  const n = bNow(), pad = x => String(x).padStart(2, '0');
  $('#clk').textContent = `${pad(n.getUTCHours())}:${pad(n.getUTCMinutes())}:${pad(n.getUTCSeconds())}`;
  $('#clkd').textContent = `Бишкек · ${DOW_S[n.getUTCDay()]}, ${n.getUTCDate()} ${MONTHS_G[n.getUTCMonth()]}`;
  const qt = $('#qTimer'); if (qt) { const s = 86400 - (n.getUTCHours() * 3600 + n.getUTCMinutes() * 60 + n.getUTCSeconds()); qt.textContent = `${Math.floor(s / 3600)}ч ${Math.floor(s % 3600 / 60)}м`; }
  if (today() !== lastDay) { lastDay = today(); render(); }
}
setInterval(tick, 1000);

applyMode(); applyTheme(); render(); tick(); paintSync();
FB_ON ? initGoogle() : initCloud();
</script>
</body>
</html>
